<script>
  // A new palette on every visit, stepping through all of them in turn. The palettes are in styles.css.
  // Runs before the body so the page never paints in the wrong colours.
  (function () {
    var count = 7, i, root = document.documentElement;
    try {
      var last = localStorage.getItem('palette');
      i = last === null ? 0 : (Number(last) + 1) % count;
      localStorage.setItem('palette', i);
    } catch {
      i = Math.floor(Math.random() * count);
      // Storage is blocked (private browsing, or cookies turned off), so there is no last
      // palette to step on from. Pick one at random instead.
    }
    root.dataset.palette = i;
    document.querySelector('meta[name="theme-color"]').content = getComputedStyle(root).getPropertyValue('--paper').trim();
  })();
</script>

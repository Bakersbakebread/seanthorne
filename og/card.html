<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Embed card source</title>
<!-- The card shown when the site is shared. /og-image.png is a headless Chrome screenshot of this
     page at 1200x630:
       chrome --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=3000 \
              --screenshot=og-image.png og/card.html
     It uses the Peach palette, and the bridge paths are a copy of the ones in index.html. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=Martian+Mono:wght@400&display=swap" rel="stylesheet">
<style>
    :root {
        --paper: #fff1e0;
        --ink: #1b1b3a;
        --highlight: #ffb3c7;
        --accent: #c2410c;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        padding: 64px 72px;
        background: var(--paper);
        color: var(--ink);
        font-family: "Inter", sans-serif;
    }

    .bridge {
        position: absolute;
        left: 50%;
        bottom: 0;
        height: 330px;
        width: calc(330px * 1916 / 821);
        translate: -50% 0;
        overflow: visible;
    }

    .t0 { fill: color-mix(in srgb, var(--ink) 3%, var(--paper)); }
    .t1 { fill: color-mix(in srgb, var(--ink) 6%, var(--paper)); }
    .t2 { fill: color-mix(in srgb, var(--ink) 11%, var(--paper)); }
    .t3 { fill: color-mix(in srgb, var(--ink) 9%, var(--paper)); }
    .t4 { fill: color-mix(in srgb, var(--ink) 16%, var(--paper)); }
    .t4s { fill: none; stroke: color-mix(in srgb, var(--ink) 16%, var(--paper)); }
    .t5 { fill: color-mix(in srgb, var(--ink) 12%, var(--paper)); }
    .t6 { fill: color-mix(in srgb, var(--ink) 15%, var(--paper)); }
    .t7 { fill: color-mix(in srgb, var(--ink) 20%, var(--paper)); }

    .top {
        position: relative;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
    }

    .line {
        font-weight: 600;
        font-size: 30px;
        line-height: 1.3;
    }

    .mark {
        width: 64px;
        height: 64px;
    }

    .address {
        position: relative;
        margin-top: 92px;
        font-weight: 800;
        font-size: 94px;
        line-height: 1;
        letter-spacing: -.04em;
        white-space: nowrap;
    }

    .at { color: var(--accent); }

    .name {
        position: relative;
        isolation: isolate;
    }

    .name::before {
        content: "";
        position: absolute;
        z-index: -1;
        left: .02em;
        right: -.02em;
        bottom: .1em;
        height: .36em;
        background: var(--highlight);
    }

    .place {
        position: relative;
        margin-top: 28px;
        font: 400 18px/1 "Martian Mono", monospace;
        letter-spacing: .08em;
        text-transform: uppercase;
    }

    .place::before {
        content: "";
        display: inline-block;
        width: 26px;
        height: 2.6px;
        margin: 0 12px 5px 0;
        border-radius: 2px;
        background: var(--accent);
        vertical-align: middle;
    }
</style>
</head>
<body>
<svg class="bridge" viewBox="0 0 1916 821" aria-hidden="true">

</svg>
<div class="top">
    <p class="line">The human in the loop.<br>Still answers his own email.</p>
    <img class="mark" src="../favicon.svg" alt="">
</div>
<p class="address">hello<span class="at">@</span><span class="name">seanthorne</span>.co.uk</p>
<p class="place">Bristol, UK</p>
</body>
</html>
